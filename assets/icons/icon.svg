<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="68%" cy="26%" r="95%">
      <stop offset="0" stop-color="#7d6ad6"/>
      <stop offset=".42" stop-color="#3b1d8c"/>
      <stop offset="1" stop-color="#1b0a45"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7bff"/>
      <stop offset="1" stop-color="#6a45e3"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb4a6"/>
      <stop offset="1" stop-color="#ff5f50"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#0a0028" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="790" cy="190" r="150" fill="#fff" opacity=".06"/>
  <circle cx="170" cy="880" r="210" fill="#ff8576" opacity=".07"/>

  <!-- carte arrière -->
  <g transform="rotate(12 560 520)" filter="url(#shadow)">
    <rect x="330" y="220" width="400" height="560" rx="56" fill="#f8a9a0" stroke="#3a1b8f" stroke-width="22"/>
  </g>

  <!-- carte avant -->
  <g transform="rotate(-9 470 520)" filter="url(#shadow)">
    <rect x="250" y="210" width="430" height="600" rx="58" fill="#ffffff" stroke="#3a1b8f" stroke-width="24"/>
    <path d="M262 268a46 46 0 0146-46h314a46 46 0 0146 46v122H262z" fill="url(#band)"/>
    <path d="M262 390h406" stroke="#3a1b8f" stroke-width="18"/>
    <rect x="330" y="285" width="270" height="42" rx="21" fill="#ffffff" opacity=".95"/>
    <g stroke="#d9d1f7" stroke-width="30" stroke-linecap="round">
      <path d="M340 480h250"/>
      <path d="M370 562h190"/>
      <path d="M335 644h260"/>
      <path d="M380 726h170"/>
    </g>
  </g>

  <!-- panneau interdit -->
  <g transform="translate(700 700)" filter="url(#shadow)">
    <circle r="170" fill="#3a1b8f"/>
    <circle r="142" fill="#ffffff"/>
    <circle r="118" fill="none" stroke="#ff6a5c" stroke-width="44"/>
    <path d="M-84 -84L84 84" stroke="#ff6a5c" stroke-width="46" stroke-linecap="round"/>
  </g>
</svg>
