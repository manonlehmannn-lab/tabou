<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Tabou</title>
  <meta name="description" content="Le jeu des mots interdits entre amis, sur un seul téléphone, 100 % hors ligne.">
  <meta name="theme-color" content="#1b0a45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabou">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/barlow-condensed-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thème appliqué avant le premier affichage pour éviter un flash.
    try {
      var s = JSON.parse(localStorage.getItem('tabou:v1:settings') || '{}');
      var t = s.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><main class="screen" style="justify-content:center;align-items:center"><p class="muted">Chargement…</p></main></div>
  <noscript>Tabou nécessite JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
